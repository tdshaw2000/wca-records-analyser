[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wca-records-analyser"
version = "0.1.0"
description = "Search World Cube Association competitors and graph their personal records."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["wca_records_analyser*"]

[tool.setuptools.package-data]
wca_records_analyser = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
