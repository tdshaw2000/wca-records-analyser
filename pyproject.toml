[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wca-records-analyser"
version = "0.1.0"
description = "Search World Cube Association competitors and graph their personal records."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Only for FastAPI's TestClient (starlette.testclient still depends on it).
    "httpx>=0.27",
    # Reads deploy/compose.yaml and the CI workflow in tests/deploy.
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["wca_records_analyser*", "wca_data*"]

[tool.setuptools.package-data]
wca_records_analyser = [
    "templates/*.html",
    "static/*",
    "static/vendor/*",
    "static/vendor/flag-icons/*",
    "static/vendor/flag-icons/flags/1x1/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
