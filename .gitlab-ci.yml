stages:
  - test
  - deploy

# Runs on the self-hosted WSL runner (shell executor) tagged "wsl-docker".
test:
  stage: test
  tags:
    - wsl-docker
  script:
    - python3 -m venv .venv
    - .venv/bin/pip install --quiet --upgrade pip
    - .venv/bin/pip install --quiet -e ".[dev]"
    - .venv/bin/pytest

# Triggers a Render deploy via its Deploy Hook, but only after the test stage
# passes on the default branch — so a red pipeline cannot reach the live Render
# site. Render's own push auto-deploy is OFF (autoDeploy: false in render.yaml),
# making this the single gated path to production. RENDER_DEPLOY_HOOK_URL is a
# masked CI/CD variable holding the hook URL (Render service > Settings > Deploy Hook).
deploy_render:
  stage: deploy
  tags:
    - wsl-docker
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
