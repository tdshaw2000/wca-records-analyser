<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}WCA Records Analyser{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css?v={{ static_version('styles.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="site-title" href="/">WCA Records Analyser</a>
        {% set current_build_number = build_number() %}
        {% if current_build_number %}
            <span class="build-number">[build {{ current_build_number }}]</span>
        {% endif %}
    </header>
    <main class="site-main">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
