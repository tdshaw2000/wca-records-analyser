<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WCA Records Analyser</title>
</head>
<body>
    <h1>WCA Records Analyser</h1>

    <form action="/search" method="get">
        <label for="name">Competitor name</label>
        <input type="text" id="name" name="name" value="{{ searched_name or '' }}">
        <button type="submit">Search</button>
    </form>

    {% if results is not none %}
        {% if results %}
            <ul>
                {% for competitor in results %}
                    <li>
                        <a href="{{ competitor.person.profile_url }}">{{ competitor.person.name }}</a>
                        <select name="event_id">
                            {% for event in competitor.events %}
                                <option value="{{ event.event_id }}">{{ event.name }}</option>
                            {% endfor %}
                        </select>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No competitors found for "{{ searched_name }}".</p>
        {% endif %}
    {% endif %}
</body>
</html>
