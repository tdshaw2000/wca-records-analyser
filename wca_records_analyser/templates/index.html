{% extends "base.html" %}

{% block content %}
    <form class="search-form" action="/search" method="get">
        <label class="field-label" for="name">Competitor (name or WCA ID)</label>
        <div class="search-row">
            <input type="text" id="name" name="name" value="{{ searched_name or '' }}">
            <button type="submit">Search</button>
        </div>
    </form>

    {% if results is not none %}
        {% if results %}
            <ul class="result-list">
                {% for person in results %}
                    <li>
                        <a href="/records?wca_id={{ person.wca_id }}&event_id={{ default_event_id }}">{{ person.name }}</a>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p class="empty-message">No competitors found for "{{ searched_name }}".</p>
        {% endif %}
    {% endif %}
{% endblock %}
