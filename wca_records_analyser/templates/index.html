<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WCA Records Analyser</title>
</head>
<body>
    <h1>WCA Records Analyser</h1>

    <form action="/search" method="get">
        <label for="name">Competitor name</label>
        <input type="text" id="name" name="name" value="{{ searched_name or '' }}">
        <button type="submit">Search</button>
    </form>

    {% if results is not none %}
        {% if results %}
            <ul>
                {% for person in results %}
                    <li>
                        <a href="/records?wca_id={{ person.wca_id }}&event_id={{ default_event_id }}">{{ person.name }}</a>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No competitors found for "{{ searched_name }}".</p>
        {% endif %}
    {% endif %}
</body>
</html>
