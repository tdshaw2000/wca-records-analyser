{% extends "base.html" %}

{% block content %}
    <section class="competitor">
        <div class="competitor-identity">
            <img class="competitor-avatar" src="{{ avatar_thumb_url }}" alt="" width="64" height="64">
            <div class="competitor-text">
                <h1 class="competitor-name">{{ name }}</h1>
                <p class="competitor-meta">
                    <span class="competitor-id">{{ wca_id }}</span>
                    <a class="profile-link" href="{{ profile_url }}" target="_blank" rel="noopener noreferrer">View WCA profile <span class="external-icon" aria-hidden="true">↗</span></a>
                </p>
            </div>
        </div>
        <p class="new-search"><a href="/">New search</a></p>
    </section>

    <div class="table-wrap overview-table">
        <table>
            <thead>
                <tr>
                    <th>Event</th>
                    <th>Latest Single</th>
                    <th>Latest Average</th>
                </tr>
            </thead>
            <tbody>
                {% for row in overview_rows %}
                    <tr>
                        <td><a href="/records?wca_id={{ wca_id }}&event_id={{ row.event_id }}">{{ row.event_name }}</a></td>
                        <td>{{ row.single_age or "—" }}</td>
                        <td>{{ row.average_age or "—" }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
