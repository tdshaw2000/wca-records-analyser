{% extends "base.html" %}

{% block content %}
    <section class="competitor">
        <div class="competitor-identity">
            <img class="competitor-avatar" src="{{ avatar_thumb_url }}" alt="" width="64" height="64">
            <div class="competitor-text">
                <h1 class="competitor-name">{{ name }}</h1>
                <p class="competitor-meta">
                    <span class="competitor-id">{{ wca_id }}</span>
                    <a class="profile-link" href="{{ profile_url }}" target="_blank" rel="noopener noreferrer">View WCA profile <span class="external-icon" aria-hidden="true">↗</span></a>
                </p>
            </div>
        </div>
        <p class="new-search"><a href="/">New search</a></p>
    </section>

    <div class="table-wrap overview-table">
        <table>
            <thead>
                <tr>
                    <th>Event</th>
                    <th>Latest Single</th>
                    <th>Latest Average</th>
                </tr>
            </thead>
            <tbody id="overview-rows" data-rows-url="{{ overview_rows_url }}">
                {% for _ in range(skeleton_row_count) %}
                    <tr class="skeleton-row">
                        <td><span class="skeleton"></span></td>
                        <td><span class="skeleton"></span></td>
                        <td><span class="skeleton"></span></td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div id="overview-map" data-map-url="/overview/map-data?wca_id={{ wca_id }}"></div>
{% endblock %}

{% block scripts %}
    <link rel="stylesheet" href="/static/vendor/leaflet.css">
    <script src="/static/overview-rows.js?v={{ static_version('overview-rows.js') }}"></script>
    <script src="/static/vendor/leaflet.js"></script>
    <script src="/static/overview-map.js?v={{ static_version('overview-map.js') }}"></script>
{% endblock %}
